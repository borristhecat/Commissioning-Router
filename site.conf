# site.conf - shared constants for one engineer kit
# See README on the PC for why each value is what it is.

NETMASK=255.255.255.0
ROUTER_IP=172.24.172.1

# Reserved: .1 router  .2 .3 devices  .5 extender  .70-.80  .200  .254 mgmt
DHCP_START=230
DHCP_LIMIT=20
DHCP_LEASETIME='720m'

SSID_24='Legrand-TechNet'
SSID_5='Legrand-TechNet_5G'
# WIFI_KEY is NOT stored here - this repo is public. It lives in
# /etc/gl-mode/unit.conf on each device, written by install.sh.
ENCRYPTION='psk2'

# MediaTek proprietary driver: htmode is the HE set, txpower is 0-100 PERCENT.
HTMODE_24='HE20'
HTMODE_5='HE20'
TXPOWER='100'
COUNTRY='DE'

# WAN failover order, highest priority first. Sets kmwan 'metric' 1,2,3...
WAN_ORDER='wan tethering wwan modem_1_1_2'
